<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sergio Valdez | IELTS Educator & ESL Teacher</title>
  
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #111111;
      --paper: #faf8f4;
      --gold: #b8933a;
      --gold-light: #e8d5a0;
      --warm-grey: #4a4540;
      --rule: #d4cbbf;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: Helvetica, Arial, sans-serif;
      font-weight: 400;
      line-height: 1.7;
      overflow-x: hidden;
    }

    .hero {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .hero__left {
      background: #1a2332;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 3rem 3rem;
    }

    .hero__eyebrow {
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 1.2rem;
    }

    .hero__photo-name {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.5rem;
    }

    .hero__photo-name img {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #b8933a;
      flex-shrink: 0;
    }

    .hero__name {
      font-size: 2rem;
      font-weight: 700;
      color: #faf8f4;
      line-height: 1.1;
    }

    .hero__name em {
      font-style: normal;
      color: var(--gold-light);
    }

    .hero__title {
      font-size: 0.85rem;
      font-weight: 400;
      color: #a0a8b0;
      letter-spacing: 0.05em;
      margin-bottom: 1.5rem;
    }

    .hero__credentials {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
